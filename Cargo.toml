[workspace]
members = [
    "crates/core",
    "crates/schema",
    "crates/director",
    "crates/node",
    "crates/gateway",
    "crates/loadtest",
    "crates/storage",
    "crates/gameplay",
    "crates/client-wasm",
    "crates/plugins/voxel",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jami Kousa <jami.kousa@gmail.com>"]
repository = "https://github.com/Jakousa/rust-server"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
explicit_into_iter_loop = "warn"
semicolon_if_nothing_returned = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
rc_buffer = "warn"
trivially_copy_pass_by_ref = "warn"

[profile.test]
debug = 1
