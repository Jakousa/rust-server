apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmo-web
  labels:
    app: mmo-web
    game: village
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mmo-web
  template:
    metadata:
      labels:
        app: mmo-web
        game: village
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: jakousa/mmo-web:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - CHOWN
                - SETGID
                - SETUID
          env:
            - name: GAME_MODE
              value: "village"
            - name: VITE_GAME_MODE
              value: "village"
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: mmo-web-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: mmo-web
  labels:
    app: mmo-web
    game: village
spec:
  type: LoadBalancer
  selector:
    app: mmo-web
  ports:
    - name: http
      port: 3000
      targetPort: 80
      protocol: TCP
