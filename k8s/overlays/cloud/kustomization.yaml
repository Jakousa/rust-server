apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - prometheus.yaml
  - grafana.yaml
  - web.yaml
  - cluster-issuer.yaml
  - middleware-redirect.yaml

images:
  - name: mmo-server:local
    newName: jakousa/mmo-server
    newTag: sha-282cd15
  - name: jakousa/mmo-web
    newName: jakousa/mmo-web
    newTag: sha-282cd15

patches:
  - target:
      kind: Deployment
      name: mmo-director
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: mmo-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: StatefulSet
      name: mmo-node
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboard-mmo-overview
    namespace: mmo
    files:
      - dashboards/mmo-overview.json
