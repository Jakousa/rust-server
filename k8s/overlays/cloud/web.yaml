apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmo-web
  namespace: mmo
  labels:
    app: mmo-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mmo-web
  template:
    metadata:
      labels:
        app: mmo-web
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: jakousa/mmo-web:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - CHOWN
                - SETGID
                - SETUID
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mmo-web
  namespace: mmo
  labels:
    app: mmo-web
spec:
  type: LoadBalancer
  selector:
    app: mmo-web
  ports:
    - name: http
      port: 3000
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mmo-web
  namespace: mmo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: mmo-redirect-to-https@kubernetescrd
spec:
  tls:
    - hosts:
        - rust-server.kousa.dev
      secretName: rust-server-tls
  rules:
    - host: rust-server.kousa.dev
      http:
        paths:
          - path: /cert-hash
            pathType: Prefix
            backend:
              service:
                name: mmo-gateway
                port:
                  number: 9091
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mmo-web
                port:
                  number: 3000
    - http:
        paths:
          - path: /cert-hash
            pathType: Prefix
            backend:
              service:
                name: mmo-gateway
                port:
                  number: 9091
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mmo-web
                port:
                  number: 3000
