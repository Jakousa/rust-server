apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mmo-node
  namespace: mmo
  labels:
    app: mmo-node
spec:
  serviceName: mmo-node
  replicas: 2
  selector:
    matchLabels:
      app: mmo-node
  template:
    metadata:
      labels:
        app: mmo-node
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node
          image: mmo-server:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              ORDINAL=${HOSTNAME##*-}
              export NODE_ID=$((ORDINAL + 1))
              echo "Starting simulation node with dynamic NODE_ID=${NODE_ID} (hostname: ${HOSTNAME})"
              if [ -n "${STARTUP_DELAY_SECS:-}" ] && [ "${STARTUP_DELAY_SECS}" -gt 0 ] 2>/dev/null; then
                echo "Applying startup delay of ${STARTUP_DELAY_SECS}s..."
                sleep "${STARTUP_DELAY_SECS}"
              fi
              exec mmo-node
          env:
            - name: STARTUP_DELAY_SECS
              value: "4"
            - name: LISTEN_ADDR
              value: "0.0.0.0:50052"
            - name: ADMIN_ADDR
              value: "0.0.0.0:9091"
            - name: DIRECTOR_ADDR
              value: "http://mmo-director:50051"
            - name: GATEWAY_GRPC_ADDR
              value: "http://mmo-gateway:50050"
            - name: DATABASE_URL
              value: "postgres://mmo:mmo_secret@postgres.mmo.svc.cluster.local:5432/mmo_db"
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
            - name: admin
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mmo-node
  namespace: mmo
  labels:
    app: mmo-node
spec:
  clusterIP: None
  selector:
    app: mmo-node
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
      protocol: TCP
    - name: admin
      port: 9091
      targetPort: 9091
      protocol: TCP
