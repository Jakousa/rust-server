apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmo-director
  namespace: mmo
  labels:
    app: mmo-director
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mmo-director
  template:
    metadata:
      labels:
        app: mmo-director
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: director
          image: mmo-server:local
          imagePullPolicy: IfNotPresent
          command: ["mmo-director"]
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:50051"
            - name: ADMIN_ADDR
              value: "0.0.0.0:9091"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: admin
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mmo-director
  namespace: mmo
  labels:
    app: mmo-director
spec:
  type: ClusterIP
  selector:
    app: mmo-director
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: admin
      port: 9091
      targetPort: 9091
      protocol: TCP
