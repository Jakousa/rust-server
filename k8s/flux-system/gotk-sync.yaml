apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: rust-server
  namespace: flux-system
spec:
  interval: 2m0s
  url: https://github.com/Jakousa/rust-server.git
  ref:
    branch: main
  ignore: |
    # Exclude non-k8s directories to minimize artifact tarball generation
    /*
    !/k8s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mmo-cloud
  namespace: flux-system
spec:
  interval: 2m0s
  path: "./k8s/overlays/cloud"
  prune: true
  sourceRef:
    kind: GitRepository
    name: rust-server
  targetNamespace: mmo
  timeout: 3m0s
  wait: true
