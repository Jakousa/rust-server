name: Bug Report
description: Report a bug, crash, or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Start the cluster: `./scripts/cluster.sh all`
        2. Connect a client...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Paste any error messages, backtraces, or logs.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Rust toolchain version (`rustc --version`), Docker/k3d version, etc.
