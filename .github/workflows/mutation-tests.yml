name: Nightly Mutation Testing

on:
  schedule:
    # Run every night at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to run mutation tests on (mmo-schema, mmo-storage, or all)'
        required: false
        default: 'all'
      additional_args:
        description: 'Additional arguments to pass to cargo-mutants'
        required: false
        default: '--jobs 2 -- --lib'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation-tests:
    name: Mutation Testing (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [mmo-schema, mmo-storage]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run Nightly Mutation Testing
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ -n "${{ inputs.package }}" ] && [ "${{ inputs.package }}" != "all" ] && [ "${{ inputs.package }}" != "${{ matrix.package }}" ]; then
            echo "Skipping ${{ matrix.package }} (package filter: ${{ inputs.package }})"
            mkdir -p mutants.out
            exit 0
          fi
          EXTRA_ARGS="${{ inputs.additional_args }}"
          if [ -z "$EXTRA_ARGS" ]; then
            EXTRA_ARGS="--jobs 2 -- --lib"
          elif [[ "$EXTRA_ARGS" != *"--jobs"* ]] && [[ "$EXTRA_ARGS" != *"-j "* ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --jobs 2"
          fi
          if [[ "$EXTRA_ARGS" != *"--"* ]]; then
            EXTRA_ARGS="$EXTRA_ARGS -- --lib"
          fi
          cargo mutants --package "${{ matrix.package }}" $EXTRA_ARGS

      - name: Upload Mutation Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-mutation-report-${{ matrix.package }}
          path: mutants.out/
