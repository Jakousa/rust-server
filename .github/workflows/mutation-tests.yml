name: Nightly Mutation Testing

on:
  schedule:
    # Run every night at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to run mutation tests on (mmo-schema, mmo-storage, or all)'
        required: false
        default: 'all'
      additional_args:
        description: 'Additional arguments to pass to cargo-mutants'
        required: false
        default: '--jobs 2'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation-tests:
    name: Mutation Testing (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [mmo-schema, mmo-storage]

    if: github.event_name == 'schedule' || inputs.package == 'all' || inputs.package == '' || inputs.package == matrix.package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-mutants
        run: cargo binstall -y cargo-mutants

      - name: Run Nightly Mutation Testing
        run: |
          EXTRA_ARGS="${{ inputs.additional_args }}"
          if [ -z "$EXTRA_ARGS" ]; then
            EXTRA_ARGS="--jobs 2"
          elif [[ "$EXTRA_ARGS" != *"--jobs"* ]] && [[ "$EXTRA_ARGS" != *"-j "* ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --jobs 2"
          fi
          cargo mutants --package "${{ matrix.package }}" $EXTRA_ARGS

      - name: Upload Mutation Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-mutation-report-${{ matrix.package }}
          path: mutants.out/

