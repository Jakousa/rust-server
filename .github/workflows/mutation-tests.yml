name: Nightly Mutation Testing

on:
  schedule:
    # Run every night at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to run mutation tests on (default: all core logic)'
        required: false
        default: 'mmo-schema'
      additional_args:
        description: 'Additional arguments to pass to cargo-mutants'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutation-tests:
    name: Mutation Testing Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-mutants
        run: cargo binstall -y cargo-mutants

      - name: Run Nightly Mutation Testing
        run: |
          if [ -n "${{ inputs.package }}" ]; then
            cargo mutants --package "${{ inputs.package }}" ${{ inputs.additional_args }}
          else
            cargo mutants --package mmo-schema --package mmo-storage
          fi

      - name: Upload Mutation Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-mutation-report
          path: mutants.out/
