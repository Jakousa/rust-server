name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"

jobs:
  filter:
    name: Check Changed Paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**.md'
              - '!openspec/**'
              - '!docs/**'
              - '!.github/dependabot.yml'
            schema:
              - 'crates/schema/**'

  lint:
    name: Lint & Audit
    needs: [filter]
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check WASM Target (mmo-client-wasm)
        run: cargo clippy --package mmo-client-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Web Frontend Unit Tests & Build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Supply-Chain and License Audit (cargo-deny)
        run: cargo deny check

      - name: Unused Dependency Check (cargo-machete)
        run: cargo machete

  test:
    name: Test & Coverage
    needs: [filter]
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mmo
          POSTGRES_PASSWORD: mmo_test_password
          POSTGRES_DB: mmo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Run Tests with Code Coverage (cargo-llvm-cov)
        env:
          TEST_POSTGRES_URL: postgres://mmo:mmo_test_password@localhost:5432/mmo_test
          REQUIRE_POSTGRES_TEST: "1"
        run: cargo llvm-cov nextest --workspace --all-targets --ignore-filename-regex 'main\.rs' --fail-under-lines 85 --lcov --output-path lcov.info

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: lcov.info

  mutants:
    name: Mutation Testing Gate
    needs: [filter]
    if: needs.filter.outputs.code == 'true' && needs.filter.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutation Testing Gate (cargo-mutants)
        run: cargo mutants --package mmo-schema --file crates/schema/src/quantize.rs --jobs 2 -- --lib quantize

      - name: Upload Mutation Testing Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants.out/

  verify:
    name: Lint, Test & Verify
    needs: [filter, lint, test, mutants]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all pipeline jobs passed
        run: |
          # 1. Reject if filter job did not succeed
          if [ "${{ needs.filter.result }}" != "success" ]; then
            echo "Filter job failed or was cancelled (status: ${{ needs.filter.result }})"
            exit 1
          fi

          # 2. Reject any failure or cancellation across all downstream jobs
          for res in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.mutants.result }}"; do
            if [ "$res" == "failure" ] || [ "$res" == "cancelled" ]; then
              echo "A downstream CI job failed or was cancelled (status: $res)"
              exit 1
            fi
          done

          # 3. If code changed, lint and test MUST have executed and succeeded
          if [ "${{ needs.filter.outputs.code }}" == "true" ]; then
            if [ "${{ needs.lint.result }}" != "success" ]; then
              echo "Code modified, but Lint job did not succeed (status: ${{ needs.lint.result }})"
              exit 1
            fi
            if [ "${{ needs.test.result }}" != "success" ]; then
              echo "Code modified, but Test job did not succeed (status: ${{ needs.test.result }})"
              exit 1
            fi
          fi

          # 4. If schema changed, mutants job MUST have executed and succeeded
          if [ "${{ needs.filter.outputs.code }}" == "true" ] && [ "${{ needs.filter.outputs.schema }}" == "true" ]; then
            if [ "${{ needs.mutants.result }}" != "success" ]; then
              echo "Schema modified, but Mutation testing job did not succeed (status: ${{ needs.mutants.result }})"
              exit 1
            fi
          fi

          echo "All required pipeline checks completed successfully!"
