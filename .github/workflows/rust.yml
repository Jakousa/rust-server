name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"

jobs:
  check-and-test:
    name: Lint, Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-llvm-cov,cargo-nextest,cargo-mutants

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Supply-Chain and License Audit (cargo-deny)
        run: cargo deny check

      - name: Unused Dependency Check (cargo-machete)
        run: cargo machete

      - name: Run Tests with Code Coverage (cargo-llvm-cov)
        run: cargo llvm-cov nextest --workspace --all-targets --ignore-filename-regex 'main\.rs' --fail-under-lines 85 --lcov --output-path lcov.info

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: lcov.info

      - name: Free build cache before mutation testing
        run: |
          cargo clean
          rm -rf /tmp/cargo-mutants*

      - name: Mutation Testing Gate (cargo-mutants)
        run: cargo mutants --package mmo-schema --file crates/schema/src/quantize.rs

      - name: Upload Mutation Testing Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
