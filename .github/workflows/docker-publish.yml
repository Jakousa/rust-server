name: Publish Docker Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*', 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'crates/**'
      - 'web/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'jakousa' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- 1. mmo-server (Authoritative Server Binaries) ---
      - name: Docker metadata for mmo-server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: jakousa/mmo-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push mmo-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=mmo-server
          cache-to: type=gha,mode=max,scope=mmo-server

      # --- 2. mmo-web (Vite + Nginx Frontend Client) ---
      - name: Docker metadata for mmo-web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: jakousa/mmo-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push mmo-web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=mmo-web
          cache-to: type=gha,mode=max,scope=mmo-web

      # --- 3. GitOps Tag Pinning ---
      - name: Update Cloud Kustomization Image Tags
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          python3 -c "
          import re
          path = 'k8s/overlays/cloud/kustomization.yaml'
          with open(path) as f: content = f.read()
          content = re.sub(r'(newName:\s*jakousa/mmo-server\s*\n\s*newTag:\s*)\S+', r'\g<1>sha-${SHORT_SHA}', content)
          content = re.sub(r'(newName:\s*jakousa/mmo-web\s*\n\s*newTag:\s*)\S+', r'\g<1>sha-${SHORT_SHA}', content)
          with open(path, 'w') as f: f.write(content)
          "
          git diff --quiet || git commit -am "chore(k8s): deploy sha-${SHORT_SHA}"
          git push --force origin HEAD:refs/heads/deploy/cloud
