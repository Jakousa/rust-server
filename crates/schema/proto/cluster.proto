syntax = "proto3";

package mmo.cluster;

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message BoundingBox {
  Vector3 min = 1;
  Vector3 max = 2;
}

// DirectorService messages
message RegisterNodeRequest {
  uint32 node_id = 1;
  string listen_addr = 2;
  BoundingBox bounds = 3;
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
  uint32 assigned_node_id = 3;
  uint64 topology_epoch = 4;
}

message HeartbeatRequest {
  uint32 node_id = 1;
  float tick_rate = 2;
  uint32 entity_count = 3;
  float cpu_percent = 4;
  uint64 memory_bytes = 5;
  uint64 timestamp = 6;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  bool should_split = 2;
  uint64 topology_epoch = 3;
}

message SplitReportRequest {
  uint32 node_id = 1;
  BoundingBox original_bounds = 2;
  repeated BoundingBox child_bounds = 3;
  uint32 total_entities = 4;
}

message SplitReportResponse {
  bool acknowledged = 1;
  repeated uint32 assigned_node_ids = 2;
  uint64 topology_epoch = 3;
}

// NodeService messages
message RemoteCommandRequest {
  uint64 guid = 1;
  uint32 action_id = 2;
  bytes payload = 3;
  uint32 source_node_id = 4;
  uint32 target_node_id = 5;
}

message RemoteCommandResponse {
  bool success = 1;
  uint32 error_code = 2;
  string error_message = 3;
  bytes result = 4;
}

message GhostEntity {
  uint64 guid = 1;
  Vector3 position = 2;
  Vector3 velocity = 3;
  float yaw = 4;
  float pitch = 5;
  bytes component_data = 6;
  uint64 last_tick = 7;
}

message GhostSyncRequest {
  uint32 source_node_id = 1;
  repeated GhostEntity ghosts = 2;
  uint64 tick = 3;
}

message GhostSyncResponse {
  bool acknowledged = 1;
  uint32 synced_count = 2;
}

// Entity Component Serialization
message SerializedComponent {
  uint32 component_id = 1;
  bytes data = 2;
}

// Migration messages
message MigrateEntityRequest {
  uint64 guid = 1;
  uint32 source_node_id = 2;
  uint32 target_node_id = 3;
  Vector3 position = 4;
  Vector3 velocity = 5;
  float yaw = 6;
  float pitch = 7;
  uint32 last_sequence = 8;
  uint64 session_id = 9;
  repeated SerializedComponent components = 10;
  uint64 topology_epoch = 11;
  uint64 last_migration_tick = 12;
}

message MigrateEntityResponse {
  bool success = 1;
  uint32 error_code = 2;
  string error_message = 3;
  uint64 acknowledged_guid = 4;
}

// Gateway Ingress Route Update messages
message RouteUpdateRequest {
  uint64 guid = 1;
  uint64 session_id = 2;
  string node_address = 3;
}

message RouteUpdateResponse {
  bool success = 1;
  string error_message = 2;
}

message ReassignNodeRoutesRequest {
  string dead_node_address = 1;
  string new_node_address = 2;
}

message ReassignNodeRoutesResponse {
  bool success = 1;
  uint32 reassigned_count = 2;
}

// Remote Ability Dispatch messages
enum RemoteAbilityErrorCode {
  REMOTE_ABILITY_SUCCESS = 0;
  REMOTE_ABILITY_TARGET_NOT_FOUND = 1;
  REMOTE_ABILITY_TARGET_DEAD = 2;
  REMOTE_ABILITY_TARGET_MIGRATING = 3;
  REMOTE_ABILITY_OUT_OF_RANGE = 4;
  REMOTE_ABILITY_INTERNAL_ERROR = 5;
}

message RemoteAbilityRequest {
  uint32 ability_id = 1;
  uint64 caster_guid = 2;
  uint64 target_guid = 3;
  uint32 source_node_id = 4;
  uint32 target_node_id = 5;
  Vector3 caster_position = 6;
  float max_range = 7;
  uint32 damage = 8;
  uint32 healing = 9;
  uint32 resource_cost = 10;
  uint64 cast_id = 11;
}

message RemoteAbilityResponse {
  bool success = 1;
  RemoteAbilityErrorCode error_code = 2;
  string error_message = 3;
  uint64 target_guid = 4;
  uint32 current_health = 5;
  uint64 cast_id = 6;
}

message BatchRemoteAbilityRequest {
  uint32 ability_id = 1;
  uint64 caster_guid = 2;
  uint32 source_node_id = 3;
  uint32 target_node_id = 4;
  Vector3 caster_position = 5;
  float max_range = 6;
  uint32 damage_per_target = 7;
  uint32 healing_per_target = 8;
  repeated uint64 target_guids = 9;
  uint64 cast_id = 10;
}

message BatchRemoteAbilityResponse {
  bool success = 1;
  repeated RemoteAbilityResponse results = 2;
  uint64 cast_id = 3;
}

// Services
service DirectorService {
  rpc RegisterNode (RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportSplit (SplitReportRequest) returns (SplitReportResponse);
}

service NodeService {
  rpc RemoteCommand (RemoteCommandRequest) returns (RemoteCommandResponse);
  rpc SyncGhosts (GhostSyncRequest) returns (GhostSyncResponse);
  rpc MigrateEntity (MigrateEntityRequest) returns (MigrateEntityResponse);
  rpc DispatchAbility (RemoteAbilityRequest) returns (RemoteAbilityResponse);
  rpc DispatchBatchAbility (BatchRemoteAbilityRequest) returns (BatchRemoteAbilityResponse);
}

service GatewayService {
  rpc UpdateRoute (RouteUpdateRequest) returns (RouteUpdateResponse);
  rpc ReassignNodeRoutes (ReassignNodeRoutesRequest) returns (ReassignNodeRoutesResponse);
}

