syntax = "proto3";

package mmo.cluster;

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message BoundingBox {
  Vector3 min = 1;
  Vector3 max = 2;
}

// DirectorService messages
message RegisterNodeRequest {
  uint32 node_id = 1;
  string listen_addr = 2;
  BoundingBox bounds = 3;
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
  uint32 assigned_node_id = 3;
  uint64 topology_epoch = 4;
}

message HeartbeatRequest {
  uint32 node_id = 1;
  float tick_rate = 2;
  uint32 entity_count = 3;
  float cpu_percent = 4;
  uint64 memory_bytes = 5;
  uint64 timestamp = 6;
  float tick_duration_ms = 7;
  Vector3 entity_centroid = 8;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  bool should_split = 2;
  uint64 topology_epoch = 3;
}

message SplitReportRequest {
  uint32 node_id = 1;
  BoundingBox original_bounds = 2;
  repeated BoundingBox child_bounds = 3;
  uint32 total_entities = 4;
}

message SplitReportResponse {
  bool acknowledged = 1;
  repeated uint32 assigned_node_ids = 2;
  uint64 topology_epoch = 3;
}

message DeregisterNodeRequest {
  uint32 node_id = 1;
}

message DeregisterNodeResponse {
  bool success = 1;
}

// NodeService messages
message RemoteCommandRequest {
  uint64 guid = 1;
  uint32 action_id = 2;
  bytes payload = 3;
  uint32 source_node_id = 4;
  uint32 target_node_id = 5;
}

message RemoteCommandResponse {
  bool success = 1;
  uint32 error_code = 2;
  string error_message = 3;
  bytes result = 4;
}

message GhostEntity {
  uint64 guid = 1;
  Vector3 position = 2;
  Vector3 velocity = 3;
  float yaw = 4;
  float pitch = 5;
  bytes component_data = 6;
  uint64 last_tick = 7;
}

message GhostSyncRequest {
  uint32 source_node_id = 1;
  repeated GhostEntity ghosts = 2;
  uint64 tick = 3;
}

message GhostSyncResponse {
  bool acknowledged = 1;
  uint32 synced_count = 2;
}

// Entity Component Serialization
message SerializedComponent {
  uint32 component_id = 1;
  bytes data = 2;
}

// Migration messages
message MigrateEntityRequest {
  uint64 guid = 1;
  uint32 source_node_id = 2;
  uint32 target_node_id = 3;
  Vector3 position = 4;
  Vector3 velocity = 5;
  float yaw = 6;
  float pitch = 7;
  uint32 last_sequence = 8;
  uint64 session_id = 9;
  repeated SerializedComponent components = 10;
  uint64 topology_epoch = 11;
  uint64 last_migration_tick = 12;
}

message MigrateEntityResponse {
  bool success = 1;
  uint32 error_code = 2;
  string error_message = 3;
  uint64 acknowledged_guid = 4;
}

message BatchMigrateEntityRequest {
  uint32 source_node_id = 1;
  uint32 target_node_id = 2;
  uint64 topology_epoch = 3;
  repeated MigrateEntityRequest entities = 4;
}

message BatchMigrateEntityResponse {
  bool success = 1;
  uint32 migrated_count = 2;
  string error_message = 3;
}

// Gateway Ingress Route Update messages
message RouteUpdateRequest {
  uint64 guid = 1;
  uint64 session_id = 2;
  string node_address = 3;
}

message RouteUpdateResponse {
  bool success = 1;
  string error_message = 2;
}

message BatchRouteUpdateRequest {
  repeated RouteUpdateRequest updates = 1;
}

message BatchRouteUpdateResponse {
  bool success = 1;
  uint32 updated_count = 2;
  string error_message = 3;
}

message ReassignNodeRoutesRequest {
  string dead_node_address = 1;
  string new_node_address = 2;
}

message ReassignNodeRoutesResponse {
  bool success = 1;
  uint32 reassigned_count = 2;
}

// Remote Ability Dispatch messages
enum RemoteAbilityErrorCode {
  REMOTE_ABILITY_SUCCESS = 0;
  REMOTE_ABILITY_TARGET_NOT_FOUND = 1;
  REMOTE_ABILITY_TARGET_DEAD = 2;
  REMOTE_ABILITY_TARGET_MIGRATING = 3;
  REMOTE_ABILITY_OUT_OF_RANGE = 4;
  REMOTE_ABILITY_INTERNAL_ERROR = 5;
}

message RemoteAbilityRequest {
  uint32 ability_id = 1;
  uint64 caster_guid = 2;
  uint64 target_guid = 3;
  uint32 source_node_id = 4;
  uint32 target_node_id = 5;
  Vector3 caster_position = 6;
  float max_range = 7;
  uint32 damage = 8;
  uint32 healing = 9;
  uint32 resource_cost = 10;
  uint64 cast_id = 11;
}

message RemoteAbilityResponse {
  bool success = 1;
  RemoteAbilityErrorCode error_code = 2;
  string error_message = 3;
  uint64 target_guid = 4;
  uint32 current_health = 5;
  uint64 cast_id = 6;
}

message BatchRemoteAbilityRequest {
  uint32 ability_id = 1;
  uint64 caster_guid = 2;
  uint32 source_node_id = 3;
  uint32 target_node_id = 4;
  Vector3 caster_position = 5;
  float max_range = 6;
  uint32 damage_per_target = 7;
  uint32 healing_per_target = 8;
  repeated uint64 target_guids = 9;
  uint64 cast_id = 10;
}

message BatchRemoteAbilityResponse {
  bool success = 1;
  repeated RemoteAbilityResponse results = 2;
  uint64 cast_id = 3;
}

// Container Transaction Messages
message ReserveContainerSlotRequest {
  string tx_id = 1;
  uint64 container_id = 2;
  int32 slot = 3;
  string item_instance_id = 4;
  string reservation_type = 5; // "transfer_out" or "transfer_in"
  uint64 lease_duration_ms = 6;
}

message ReserveContainerSlotResponse {
  bool success = 1;
  string error_message = 2;
  string reservation_id = 3;
  uint64 expires_at_epoch_ms = 4;
}

message CommitContainerTransferRequest {
  string tx_id = 1;
}

message CommitContainerTransferResponse {
  bool success = 1;
  string error_message = 2;
  uint64 src_container_id = 3;
  uint64 dst_container_id = 4;
  string item_instance_id = 5;
}

message AbortContainerTransferRequest {
  string tx_id = 1;
}

message AbortContainerTransferResponse {
  bool success = 1;
  string error_message = 2;
}

// Geo-Distributed Gateway Messages
message RegisterGatewayRequest {
  string gateway_id = 1;
  string region = 2;
  string listen_addr = 3;
  string grpc_addr = 4;
  string probe_addr = 5;
  uint32 capacity = 6;
}

message RegisterGatewayResponse {
  bool success = 1;
  string error_message = 2;
  uint64 heartbeat_interval_ms = 3;
}

message GatewayHeartbeatRequest {
  string gateway_id = 1;
  uint32 active_sessions = 2;
  float cpu_percent = 3;
  float memory_percent = 4;
  uint64 timestamp_ms = 5;
}

message GatewayHeartbeatResponse {
  bool acknowledged = 1;
  bool should_drain = 2;
}

message DeregisterGatewayRequest {
  string gateway_id = 1;
}

message DeregisterGatewayResponse {
  bool success = 1;
}

message TakeoverSessionRouteRequest {
  uint64 guid = 1;
  uint64 new_session_id = 2;
  string new_gateway_id = 3;
  string new_gateway_grpc_addr = 4;
  uint64 session_epoch = 5;
  bytes handover_signature = 6;
}

message TakeoverSessionRouteResponse {
  bool success = 1;
  string error_message = 2;
  uint64 authoritative_epoch = 3;
}

message RevokeGatewaySessionRequest {
  uint64 guid = 1;
  uint64 session_id = 2;
  uint64 superseded_by_epoch = 3;
}

message RevokeGatewaySessionResponse {
  bool success = 1;
}

message MultiGatewayRouteBroadcastRequest {
  uint64 guid = 1;
  uint64 session_id = 2;
  string new_node_address = 3;
  uint64 session_epoch = 4;
}

message MultiGatewayRouteBroadcastResponse {
  bool success = 1;
  uint32 acknowledged_gateways = 2;
}

// Dynamic Instance Messages
message CreateInstanceRequest {
  uint64 instance_id = 1;
  uint32 template_id = 2;
  BoundingBox bounds = 3;
  uint32 idle_timeout_seconds = 4;
  uint32 preferred_node_id = 5; // 0 for automatic least-loaded selection
}

message CreateInstanceResponse {
  bool success = 1;
  string error_message = 2;
  uint64 instance_id = 3;
  uint32 assigned_node_id = 4;
  string node_address = 5;
}

message TerminateInstanceRequest {
  uint64 instance_id = 1;
  string reason = 2;
}

message TerminateInstanceResponse {
  bool success = 1;
  string error_message = 2;
}

message InstanceHeartbeatRequest {
  uint64 instance_id = 1;
  uint32 node_id = 2;
  uint32 player_count = 3;
  uint32 total_entity_count = 4;
  bool is_idle = 5;
}

message InstanceHeartbeatResponse {
  bool acknowledged = 1;
  bool should_terminate = 2;
}

// Cross-Cluster Realm Federation Messages
message IssueRealmTransferClaimRequest {
  uint64 guid = 1;
  string source_realm_id = 2;
  string target_realm_id = 3;
  uint64 session_epoch = 4;
  uint64 ttl_ms = 5;
}

message IssueRealmTransferClaimResponse {
  bool success = 1;
  string error_message = 2;
  uint64 nonce = 3;
  uint64 expires_at_epoch_ms = 4;
  bytes signature = 5;
}

message VerifyRealmTransferClaimRequest {
  uint64 guid = 1;
  string source_realm_id = 2;
  string target_realm_id = 3;
  uint64 session_epoch = 4;
  uint64 nonce = 5;
  uint64 expires_at_epoch_ms = 6;
  bytes signature = 7;
}

message VerifyRealmTransferClaimResponse {
  bool valid = 1;
  string error_message = 2;
}

// Client Packet Forwarding & AoI Delivery Messages
message ForwardClientPacketRequest {
  uint64 session_id = 1;
  uint64 guid = 2;
  bytes packet_data = 3;
}

message ForwardClientPacketResponse {
  bool success = 1;
  string error_message = 2;
}

message SessionPacketBatch {
  uint64 session_id = 1;
  repeated bytes packets = 2;
}

message DeliverBroadcastJobsRequest {
  repeated SessionPacketBatch jobs = 1;
}

message DeliverBroadcastJobsResponse {
  bool success = 1;
  uint32 delivered_count = 2;
  repeated uint64 disconnected_sessions = 3;
}

// Services
service DirectorService {
  rpc RegisterNode (RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportSplit (SplitReportRequest) returns (SplitReportResponse);
  rpc RegisterGateway (RegisterGatewayRequest) returns (RegisterGatewayResponse);
  rpc GatewayHeartbeat (GatewayHeartbeatRequest) returns (GatewayHeartbeatResponse);
  rpc CreateInstance (CreateInstanceRequest) returns (CreateInstanceResponse);
  rpc TerminateInstance (TerminateInstanceRequest) returns (TerminateInstanceResponse);
  rpc InstanceHeartbeat (InstanceHeartbeatRequest) returns (InstanceHeartbeatResponse);
  rpc IssueRealmTransferClaim (IssueRealmTransferClaimRequest) returns (IssueRealmTransferClaimResponse);
  rpc VerifyRealmTransferClaim (VerifyRealmTransferClaimRequest) returns (VerifyRealmTransferClaimResponse);
  rpc DeregisterNode (DeregisterNodeRequest) returns (DeregisterNodeResponse);
  rpc DeregisterGateway (DeregisterGatewayRequest) returns (DeregisterGatewayResponse);
}

service NodeService {
  rpc RemoteCommand (RemoteCommandRequest) returns (RemoteCommandResponse);
  rpc SyncGhosts (GhostSyncRequest) returns (GhostSyncResponse);
  rpc MigrateEntity (MigrateEntityRequest) returns (MigrateEntityResponse);
  rpc MigrateBatchEntities (BatchMigrateEntityRequest) returns (BatchMigrateEntityResponse);
  rpc DispatchAbility (RemoteAbilityRequest) returns (RemoteAbilityResponse);
  rpc DispatchBatchAbility (BatchRemoteAbilityRequest) returns (BatchRemoteAbilityResponse);
  rpc ReserveContainerSlot (ReserveContainerSlotRequest) returns (ReserveContainerSlotResponse);
  rpc CommitContainerTransfer (CommitContainerTransferRequest) returns (CommitContainerTransferResponse);
  rpc AbortContainerTransfer (AbortContainerTransferRequest) returns (AbortContainerTransferResponse);
  rpc TakeoverSessionRoute (TakeoverSessionRouteRequest) returns (TakeoverSessionRouteResponse);
  rpc ForwardClientPacket (ForwardClientPacketRequest) returns (ForwardClientPacketResponse);
}

service GatewayService {
  rpc UpdateRoute (RouteUpdateRequest) returns (RouteUpdateResponse);
  rpc UpdateBatchRoutes (BatchRouteUpdateRequest) returns (BatchRouteUpdateResponse);
  rpc ReassignNodeRoutes (ReassignNodeRoutesRequest) returns (ReassignNodeRoutesResponse);
  rpc RevokeGatewaySession (RevokeGatewaySessionRequest) returns (RevokeGatewaySessionResponse);
  rpc BroadcastRoute (MultiGatewayRouteBroadcastRequest) returns (MultiGatewayRouteBroadcastResponse);
  rpc DeliverBroadcastJobs (DeliverBroadcastJobsRequest) returns (DeliverBroadcastJobsResponse);
}



