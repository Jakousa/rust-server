[package]
name = "mmo-schema"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["grpc"]
grpc = ["dep:tonic"]

[dependencies]
prost = "0.13.4"
tonic = { version = "0.12.3", optional = true }
bytes = "1.9"
thiserror = "2.0"

[build-dependencies]
tonic-build = "0.12.3"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
proptest = "1.6"

