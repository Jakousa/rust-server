[package]

name = "mmo-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "macros"] }
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.27", features = ["tokio-comp"] }
thiserror = "1.0"
async-trait = "0.1"
sha2 = "0.10"
subtle = "2.6"

[dev-dependencies]
tempfile = "3.14"

[lints]
workspace = true
