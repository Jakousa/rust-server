[package]
name = "mmo-plugin-voxel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Decoupled volumetric voxel and deformable terrain plugin for OpenSpec MMO"

[dependencies]
mmo-core = { path = "../../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
bytes = "1.9"
tracing = "0.1"
dashmap = "6.1"
tokio = { version = "1.42", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3.14"

[lints]
workspace = true
