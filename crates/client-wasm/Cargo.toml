[package]

name = "mmo-client-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WebAssembly client core for OpenSpec MMO - zero-duplication codec and interpolation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mmo-schema = { path = "../schema", default-features = false }
wasm-bindgen = "0.2"
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[lints]
workspace = true
