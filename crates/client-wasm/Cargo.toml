[package]
name = "mmo-client-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly client core for OpenSpec MMO - zero-duplication codec and interpolation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mmo-schema = { path = "../schema", default-features = false }
wasm-bindgen = "0.2"
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
