[package]

name = "mmo-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mmo-core = { path = "../core" }
mmo-schema = { path = "../schema" }
tokio = { version = "1.42", features = ["full"] }
tonic = "0.12.3"
mmo-storage = { path = "../storage" }
mmo-gameplay = { path = "../gameplay" }
serde_json = "1.0"
metrics = "0.24"
thiserror = "2.0"


[dev-dependencies]
criterion = { version = "0.5", default-features = false }
mmo-gateway = { path = "../gateway" }
bytes = "1.9"
proptest = "1.6"

[[bench]]
name = "engine_benchmarks"
path = "../../benches/engine_benchmarks.rs"
harness = false

[lints]
workspace = true
