[package]
name = "mmo-node"
version = "0.1.0"
edition = "2021"

[dependencies]
mmo-core = { path = "../core" }
mmo-schema = { path = "../schema" }
tokio = { version = "1.42", features = ["full"] }
tonic = "0.12.3"
mmo-storage = { path = "../storage" }
mmo-gameplay = { path = "../gameplay" }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
mmo-gateway = { path = "../gateway" }
bytes = "1.9"

[[bench]]
name = "engine_benchmarks"
path = "../../benches/engine_benchmarks.rs"
harness = false
