[package]

name = "mmo-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mmo-core = { path = "../core" }
mmo-schema = { path = "../schema" }
tokio = { version = "1.42", features = ["full"] }
tonic = "0.12.3"
mmo-storage = { path = "../storage" }
serde_json = "1.0"
metrics = "0.24"
thiserror = "2.0"
bytes = "1.9"
tracing = "0.1"
dashmap = "6.1"


[dev-dependencies]
mmo-gameplay = { path = "../gameplay" }
criterion = { version = "0.5", default-features = false }
mmo-gateway = { path = "../gateway" }
mmo-director = { path = "../director" }
bytes = "1.9"
dashmap = "6.1"
proptest = "1.6"
tokio-stream = { version = "0.1", features = ["net"] }


[[test]]
name = "it"
path = "tests/it/main.rs"

[[bench]]
name = "engine_benchmarks"
path = "benches/engine_benchmarks.rs"
harness = false

[lints]
workspace = true
