[package]
name = "mmo-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
mmo-core = { path = "../core" }
mmo-schema = { path = "../schema" }
mmo-storage = { path = "../storage" }
tokio = { version = "1.42", features = ["full"] }
tonic = "0.12.3"
bytes = "1.9"
thiserror = "2.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[dev-dependencies]
mmo-node = { path = "../node" }
mmo-director = { path = "../director" }


