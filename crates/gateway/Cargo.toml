[package]

name = "mmo-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mmo-core = { path = "../core" }
mmo-schema = { path = "../schema" }
mmo-storage = { path = "../storage" }
tokio = { version = "1.42", features = ["full"] }
tonic = "0.12.3"
bytes = "1.9"
thiserror = "2.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
dashmap = "6.1"
metrics = "0.24"
wtransport = "0.7.2"
ring = "0.17"
jsonwebtoken = "9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
data-encoding = "2.8"
tracing = "0.1"

[dev-dependencies]
mmo-node = { path = "../node" }
mmo-director = { path = "../director" }

[[test]]
name = "it"
path = "tests/it/main.rs"



[lints]
workspace = true
