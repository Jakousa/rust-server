syntax = "proto3";
package game;

service Player {
    rpc Create (CreateRequest) returns (CreateReply);
    rpc Update (UpdateRequest) returns (UpdateReply);
}

message CreateRequest {
   string name = 1;
}

message CreateReply {
   string message = 1;
}

message UpdateRequest {
    string name = 1;
    int32 x = 2;
    int32 y = 3;
    int32 z = 4;
}

message UpdateReply {
    string message = 1;
}